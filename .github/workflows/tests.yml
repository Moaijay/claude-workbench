name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare CI fixture
        run: python tests/ci_fixture.py
      - name: Run regression suite
        run: python tests/regression.py
